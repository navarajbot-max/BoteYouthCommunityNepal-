<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003893"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#DC143C"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background circle with authentic Nepali Crimson & Blue gradient -->
  <rect width="120" height="120" rx="60" fill="url(#avatarBg)"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Sacred Sun Crest in Header Background -->
  <circle cx="60" cy="22" r="8" fill="url(#goldAcc)" opacity="0.9"/>
  <path d="M 60 10 L 60 13 M 60 31 L 60 34 M 48 22 L 51 22 M 69 22 L 72 22 M 52 14 L 54 16 M 68 14 L 66 16 M 52 30 L 54 28 M 68 30 L 66 28" stroke="#FCD34D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dignified Leader Head Silhouette -->
  <circle cx="60" cy="46" r="16" fill="#FFFFFF"/>

  <!-- Dignified Leader Shoulders with Indigenous Dhaka Pattern Neck Trim -->
  <path d="M 28 98 C 28 74 42 66 60 66 C 78 66 92 74 92 98 Z" fill="#FFFFFF"/>
  <path d="M 52 66 L 60 76 L 68 66 Z" fill="#DC143C"/>
  <circle cx="60" cy="80" r="3" fill="#F59E0B"/>

  <!-- Traditional Bote Dugout Wooden Boat (Dunga) on River Waves at Bottom -->
  <path d="M 32 104 Q 60 114 88 104 Q 76 112 60 112 Q 44 112 32 104 Z" fill="#F59E0B" stroke="#78350F" stroke-width="0.75"/>
  <path d="M 24 111 Q 42 107 60 111 T 96 111" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round"/>
</svg>
